name: CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Incrementar version
        run: |
          FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          sed -i "s/AppVersion-0/AppVersion-1 ($FECHA)/g" README.md || echo "AppVersion-1 ($FECHA)" >> README.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: bump version [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref }} || echo "Push omitido"

  validate-prod:
    runs-on: self-hosted
    needs: bump-version
    steps:
      - name: Validar token PROD
        run: |
          if [ "${{ secrets.PROD_TOKEN }}" = "$LOCAL_PROD_TOKEN" ]; then
            echo "Token correcto"
          else
            echo "Token no coincide"
            exit 1
          fi
